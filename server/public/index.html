<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17212b"><link rel="manifest" href="/manifest.webmanifest"><title>5S Management System</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"><style>/* Layout: fixed steel sidebar + sticky top bar; content is a 12-col fluid grid of cards; execution screen is a single-column, thumb-first flow. */
:root {

  --tape: #f2b705; --tape-ink: #1b1b1b;

  --f-body: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --r: 8px; --r-sm: 5px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141a; --surface: #161f28; --surface-2: #1b2530; --surface-3: #222e3a; --line: #2b3946; --line-2: #24313d;
  --ink: #e5ebf0; --ink-2: #a7b4bf; --ink-3: #75848f; --accent: #5ea3da; --accent-2: #7cb6e4; --accent-soft: #16324a; --on-accent: #0b1620;
  --tape: #f2b705; --tape-ink: #1b1b1b;

  --good: #49b97a; --good-soft: #16301f; --warn: #e2a72e; --warn-soft: #33290f; --bad: #ef6b5f; --bad-soft: #3a1d1a; --info: #6aa8ec; --info-soft: #172b40; --violet: #9a92f0; --violet-soft: #25234a; --teal: #45b8bd; --teal-soft: #11302f;
  --s1: #e07a5c; --s2: #e2b93a; --s3: #4cbad2; --s4: #8d95f0; --s5: #5cc08a;

} }

  --bg: #0e141a; --surface: #161f28; --surface-2: #1b2530; --surface-3: #222e3a; --line: #2b3946; --line-2: #24313d;
  --ink: #e5ebf0; --ink-2: #a7b4bf; --ink-3: #75848f; --accent: #5ea3da; --accent-2: #7cb6e4; --accent-soft: #16324a; --on-accent: #0b1620;
  --tape: #f2b705; --tape-ink: #1b1b1b;
  --nav-bg: #0a0f14; --nav-bg-2: #131b23; --nav-ink: #c3cdd6; --nav-ink-2: #7d8b97;
  --good: #49b97a; --good-soft: #16301f; --warn: #e2a72e; --warn-soft: #33290f; --bad: #ef6b5f; --bad-soft: #3a1d1a; --info: #6aa8ec; --info-soft: #172b40; --violet: #9a92f0; --violet-soft: #25234a; --teal: #45b8bd; --teal-soft: #11302f;

html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: 26px; font-weight: 600; } h2 { font-size: 19px; font-weight: 600; } h3 { font-size: 16px; font-weight: 600; } h4 { font-size: 14px; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; vertical-align: -3px; }
.mono { font-family: var(--f-mono); font-size: .92em; letter-spacing: -.01em; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .small { font-size: 12px; } .tiny { font-size: 11px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
.nowrap { white-space: nowrap; } .right { text-align: right; } .center { text-align: center; }
.hide { display: none !important; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .row.tight { gap: 6px; } .row.between { justify-content: space-between; } .row.top { align-items: flex-start; }
.stack { display: flex; flex-direction: column; gap: 12px; } .stack.tight { gap: 6px; } .stack.loose { gap: 20px; }
.grow { flex: 1 1 auto; min-width: 0; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
@media (max-width: 1180px) { .c3 { grid-column: span 6; } .c4, .c5 { grid-column: span 6; } .c7, .c8 { grid-column: span 12; } .c6 { grid-column: span 12; } }
@media (max-width: 720px) { .grid > * { grid-column: span 12 !important; } }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--nav-bg); color: var(--nav-ink); position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; z-index: 40; }
.brand { padding: 16px 18px 14px; display: flex; gap: 12px; align-items: center; }
.brand-mark { width: 38px; height: 38px; border-radius: 7px; background: var(--tape); color: var(--tape-ink); display: grid; place-items: center; font: 700 17px/1 var(--f-display); letter-spacing: -.02em; flex: none; }
.brand-name { font: 600 16px/1.1 var(--f-display); color: #fff; letter-spacing: .02em; }
.brand-sub { font-size: 11px; color: var(--nav-ink-2); }
.tape { height: 6px; background: repeating-linear-gradient(-45deg, var(--tape) 0 10px, #1b1b1b 10px 20px); opacity: .9; }
.nav { padding: 10px 10px 20px; display: flex; flex-direction: column; gap: 1px; }
.nav-sec { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--nav-ink-2); padding: 14px 10px 6px; font-weight: 600; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 6px; color: var(--nav-ink); text-decoration: none; cursor: pointer; font-size: 13.5px; border: 1px solid transparent; }
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav a:hover { background: var(--nav-bg-2); color: #fff; }
.nav a.on { background: var(--nav-bg-2); color: #fff; border-color: #2c3a47; }
.nav a.on svg { color: var(--tape); opacity: 1; }
.nav .count { margin-left: auto; background: var(--bad); color: #fff; border-radius: 10px; font-size: 11px; padding: 0 7px; line-height: 18px; font-weight: 600; }
.side-foot { margin-top: auto; padding: 12px 18px 18px; font-size: 11px; color: var(--nav-ink-2); border-top: 1px solid #22303c; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); height: 56px; display: flex; align-items: center; gap: 10px; padding-inline: 16px; }
.top .burger { display: none; }
.search { position: relative; flex: 1 1 280px; max-width: 460px; }
.search input { width: 100%; height: 36px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 7px; padding: 0 12px 0 34px; }
.search svg { position: absolute; left: 10px; top: 9px; width: 18px; height: 18px; color: var(--ink-3); }
.search-res { position: absolute; top: 42px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); max-height: 70vh; overflow: auto; z-index: 50; }
.search-res .sr-h { padding: 8px 12px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.search-res a { display: flex; gap: 10px; padding: 7px 12px; text-decoration: none; color: var(--ink); cursor: pointer; align-items: baseline; }
.search-res a:hover, .search-res a.sel { background: var(--accent-soft); }
.top-sel { height: 36px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); padding: 0 8px; max-width: 150px; }
.net { font-size: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.net i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }
.net.off i { background: var(--bad); } .net.sync i { background: var(--warn); } .net.ro i { background: var(--ink-3); }
.iconbtn { width: 36px; height: 36px; border-radius: 7px; display: inline-grid; place-items: center; border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink-2); position: relative; flex: none; }
.iconbtn:hover { background: var(--surface-2); border-color: var(--line); }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn .dot { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.me { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 6px; border-radius: 7px; border: 1px solid transparent; background: none; }
.me:hover { background: var(--surface-2); border-color: var(--line); }
.me .who { text-align: left; line-height: 1.2; } .me .who b { font-weight: 600; font-size: 13px; display: block; } .me .who span { font-size: 11px; color: var(--ink-3); }
.content { padding: 20px 24px 60px; width: 100%; max-width: 1480px; margin: 0 auto; }
.pagehead { display: flex; gap: 14px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 16px; }
.pagehead .crumbs { font-size: 12px; color: var(--ink-3); margin-bottom: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
.pagehead .crumbs a { color: var(--ink-2); text-decoration: none; cursor: pointer; } .pagehead .crumbs a:hover { color: var(--accent); }
.scrim { display: none; }
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 272px; transform: translateX(-100%); transition: transform .2s ease; padding-top: env(safe-area-inset-top, 0px); }
  .app.nav-open .side { transform: none; }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(8,12,16,.45); z-index: 35; }
  .top .burger { display: inline-grid; }
  .content { padding: 16px 16px 80px; }
  .me .who, .top-sel.opt { display: none; }
  .search { flex-basis: 120px; }
}
@media (max-width: 560px) { .net span { display: none; } .net { padding: 6px; } h1 { font-size: 22px; } }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 0; flex-wrap: wrap; }
.card-h .sub { font-size: 12px; color: var(--ink-3); }
.card-b { padding: 14px 16px 16px; }
.card.flat { box-shadow: none; }
.panel { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 12px 14px; }
.divider { height: 1px; background: var(--line-2); margin: 4px 0; }

/* KPI tiles */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpis.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1180px) { .kpis.six { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) { .kpis, .kpis.six { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; cursor: default; text-align: left; box-shadow: var(--shadow); }
button.kpi { cursor: pointer; } button.kpi:hover { border-color: var(--accent); }
.kpi .k-l { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.kpi .k-v { font: 600 30px/1.05 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .k-v small { font-size: 16px; color: var(--ink-3); font-weight: 500; }
.kpi .k-s { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.kpi.mini .k-v { font-size: 22px; }
.kpi .meter { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.kpi .meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.delta { font-weight: 600; font-size: 12px; } .delta.up { color: var(--good); } .delta.down { color: var(--bad); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 500; white-space: nowrap; text-decoration: none; font-size: 13.5px; }
.btn:hover { border-color: var(--ink-3); }
.btn svg { width: 17px; height: 17px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); } .btn.primary:hover { background: var(--accent-2); }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: var(--surface); } .btn.danger.solid { background: var(--bad); color: #fff; }
.btn.ghost { border-color: transparent; background: none; } .btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; } .btn.lg { height: 48px; padding: 0 20px; font-size: 15px; font-weight: 600; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.block { width: 100%; }

/* tabs & segmented */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 13px; cursor: pointer; color: var(--ink-2); font-weight: 500; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button .n { background: var(--surface-3); color: var(--ink-2); border-radius: 9px; padding: 0 6px; font-size: 11px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 10px; font-size: 11.5px; font-weight: 600; white-space: nowrap; line-height: 18px; background: var(--surface-3); color: var(--ink-2); }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.badge.plain::before { display: none; }
.b-blue { background: var(--info-soft); color: var(--info); } .b-indigo { background: var(--violet-soft); color: var(--violet); } .b-amber { background: var(--warn-soft); color: var(--warn); }
.b-teal { background: var(--teal-soft); color: var(--teal); } .b-green { background: var(--good-soft); color: var(--good); } .b-red { background: var(--bad-soft); color: var(--bad); }
.b-gray { background: var(--surface-3); color: var(--ink-2); } .b-outline { background: none; border: 1px dashed var(--ink-3); color: var(--ink-2); }
.sev { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.sev i { width: 4px; height: 14px; border-radius: 2px; display: inline-block; }
.score { display: inline-flex; align-items: center; justify-content: center; min-width: 48px; height: 24px; padding: 0 7px; border-radius: 5px; font: 600 13.5px/1 var(--f-display); font-variant-numeric: tabular-nums; color: #fff; }
.score.lg { height: 34px; min-width: 64px; font-size: 18px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 14px; padding: 2px 10px; font-size: 12px; background: var(--surface); }
.chip button { border: 0; background: none; cursor: pointer; color: var(--ink-3); padding: 0; line-height: 1; }
.s-tag { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 20px; border-radius: 4px; font: 700 11.5px/1 var(--f-display); color: #fff; flex: none; }
.s-S1 { background: var(--s1); } .s-S2 { background: var(--s2); } .s-S3 { background: var(--s3); } .s-S4 { background: var(--s4); } .s-S5 { background: var(--s5); }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; font: 600 11px/1 var(--f-body); color: #fff; flex: none; letter-spacing: .02em; }
.avatar.sm { width: 22px; height: 22px; font-size: 9.5px; } .avatar.lg { width: 40px; height: 40px; font-size: 14px; }
.avs { display: inline-flex; } .avs .avatar { border: 2px solid var(--surface); margin-left: -6px; } .avs .avatar:first-child { margin-left: 0; }
.person { display: inline-flex; align-items: center; gap: 7px; min-width: 0; } .person span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* tables */
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); position: sticky; top: 0; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--surface-2); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr.over td { background: color-mix(in srgb, var(--bad-soft) 60%, transparent); }
.tbl .clip { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 2px 0; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }

/* filters */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filters select, .filters input { height: 34px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); padding: 0 10px; min-width: 0; max-width: 220px; }
.filters .lbl { font-size: 12px; color: var(--ink-3); }

/* forms */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.form.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .form, .form.three { grid-template-columns: minmax(0, 1fr); } }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field > label .req { color: var(--bad); }
.field input:not([type=checkbox]):not([type=radio]):not([type=file]), .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 8px 10px; min-height: 38px; width: 100%; }
.field textarea { min-height: 72px; resize: vertical; }
.field .help { font-size: 11.5px; color: var(--ink-3); }
.field.err input, .field.err select, .field.err textarea { border-color: var(--bad); }

        try { await this.adapter.write(w.op === 'update' ? { op: 'set', c: w.c, id: w.id, doc: this.get(w.c, w.id) || w.doc } : w); this.outbox.shift(); await IDB.set('outbox', this.outbox); }
        catch (e) { if (e && (e.code === 'invalid_argument' || e.code === 'forbidden')) { this.outbox.shift(); continue; } break; }
      }
      // queued submissions (offline audit submit)
      const pend = LS.get('pendingSubmits', []);
      for (const id of pend) { try { await Domain.submitAudit(id, { fromQueue: true }); } catch (e) { break; } }
    } finally { this._flushing = false; App.refreshChrome(); }
  },
  _persistT: null,
  _persist() { clearTimeout(this._persistT); this._persistT = setTimeout(() => { const snap = {}; COLLS.forEach((c) => { if (this.data[c]) snap[c] = this.all(c); }); IDB.set('snapshot', { at: Date.now(), data: snap }); }, 2500); },
  async loadCache() { const s = await IDB.get('snapshot'); this.outbox = (await IDB.get('outbox')) || []; if (s && s.data) { Object.entries(s.data).forEach(([c, docs]) => { const m = new Map(); docs.forEach((d) => m.set(d.id, d)); this.data[c] = m; delete this.arrays[c]; }); return true; } return false; },
  async nextNo(kind) {
    const n = await this.adapter.nextNumber(kind);
    const st = Domain.settings(); const y = new Date().getFullYear();
    return { n, no: FS.formatNo((st.numbering || {})[kind], kind, y, n), id: kind + '-' + FS.pad(n, 6) };
  },
  async savePhoto(p) { // p: {full, thumb, ...meta}
    const id = uid('PH-'); const meta = Object.assign({}, p); delete meta.full;
    this.photoCache.set(id, p.full);
    if (this.adapter && this.adapter.savePhoto) { try { const r = await this.adapter.savePhoto(id, p); if (r && r.id) return Object.assign(meta, { id: r.id, url: r.url }); } catch (e) { /* fall back to queued doc */ } }
    return Object.assign(meta, { id });
  },
  async photoFull(ref) {

    if (this.photoCache.has(ref.id)) return this.photoCache.get(ref.id);
    try { const f = this.adapter && (await this.adapter.getPhoto(ref.id)); if (f) { this.photoCache.set(ref.id, f); return f; } } catch (e) {}
    return ref.thumb;
  },
};

/* ---------- adapter: claude.ai shared db ---------- */
function DbAdapter(db) {
  const unsubs = [];
  return {
    kind: 'db',
    start() {
      COLLS.forEach((c) => unsubs.push(db.collection(c).onSnapshot((snap) => Store.applySnapshot(c, snap.docs.map((d) => Object.assign({}, d.data(), { id: d.id }))), (e) => { console.warn('snapshot error', c, e); if (e && e.code === 'unavailable') setTimeout(() => location.reload(), 8000); })));
    },
    remoteHas(c, id) { return false; },
    async write(w) {
      const ref = db.doc(w.c + '/' + w.id);
      if (w.op === 'set') return ref.set(w.doc);
      if (w.op === 'update') return ref.update(w.doc);
      if (w.op === 'delete') return ref.delete();
    },
    async nextNumber(kind) {
      const ref = db.doc('cfg/counters');
      for (let i = 0; i < 25; i++) {
        let r; try { r = await ref.acquire({ holder: SESSION, ttlMs: 1500 }); } catch (e) { r = { acquired: false }; }
        if (r.acquired) {
          const s = await ref.get(); const cur = Number(((s.exists && s.data()) || {})[kind] || 0); const n = cur + 1;
          if (s.exists) await ref.update({ [kind]: n }); else await ref.set({ [kind]: n });
          return n;
        }
        await sleep(200 + Math.random() * 300);
      }
      throw { code: 'unavailable', message: 'Numbering service busy, try again.' };
    },
    async savePhoto(id, p) { await db.doc('photos/' + id).set({ full: p.full, thumb: p.thumb, name: p.name || '', at: nowISO(), by: p.by || '' }); return { id }; },
    async getPhoto(id) { const s = await db.doc('photos/' + id).get(); return s.exists ? s.data().full : null; },
    async acquire(path, ttl) { try { const r = await db.doc(path).acquire({ holder: SESSION, ttlMs: ttl || 20000 }); return r.acquired; } catch (e) { return false; } },
  };
}

const Domain = {

  avColor(id) { let h = 0; String(id).split('').forEach((c) => (h = (h * 31 + c.charCodeAt(0)) >>> 0)); return AV_COLORS[h % AV_COLORS.length]; },
  woStatus(w) { return FS.woDisplayStatus(w, this.today); },

  findSt(f) { return FS.findingStatus(f, Store.all('actions')); },
  isActOpen(a) { return !FS.ACT_CLOSED.includes(a.status); },
  checksheet(id) { return Store.get('checksheets', id); },
  questionsOf(wo) { const cs = this.checksheet(wo.checksheetId); return (cs && cs.questions) || wo.questions || []; },
  activeChecksheet(family) { return Store.all('checksheets').filter((c) => c.family === family && c.status === 'Active').sort((a, b) => Number(b.version) - Number(a.version))[0]; },
  isDone(w) { return FS.WO_DONE.includes(w.status); },

  /* permissions & scope */
  perm(func) { const u = App.user; if (!u) return 'none'; const p = (this.settings().permissions || {})[u.role] || {}; return p[func] || 'none'; },
  can(func, level = 'view') { const order = { none: 0, limited: 1, view: 1, edit: 2 }; return (order[this.perm(func)] || 0) >= (order[level] || 1); },
  myZoneIds() {

  },
  scopeZones() { const ids = new Set(this.myZoneIds()); return Store.all('zones').filter((z) => ids.has(z.id) && (App.plant === 'all' || z.plant === App.plant)); },
  inScope(rec) { if (!rec) return false; const u = App.user; if (u && u.role === 'auditor' && rec.auditor === u.id) return true; return this._scopeSet().has(rec.zone || rec.id); },
  _scopeSet() { if (!this._ss || this._ssv !== Store.arrays.zones || this._ssp !== App.plant + (App.user && App.user.id)) { this._ss = new Set(this.scopeZones().map((z) => z.id)); this._ssv = Store.arrays.zones; this._ssp = App.plant + (App.user && App.user.id); } return this._ss; },
  wos() { return Store.all('workorders').filter((w) => this.inScope(w)); },
  findings() { return Store.all('findings').filter((f) => this.inScope(f)); },
  actions() { const u = App.user; return Store.all('actions').filter((a) => this.inScope(a) || (u && a.responsible === u.id)); },

  /* periods */
  periodRange(p) {
    const st = this.settings(); const fy = st.fiscalYearStart || 4;
    if (!p || p.type === 'all') return ['0000-01-01', '9999-12-31'];
    if (p.type === 'month') { const s = p.value + '-01'; return [s, FS.addDays(FS.addMonths(s, 1), -1)]; }
    if (p.type === 'quarter') { const [y, q] = p.value.split('-Q').map(Number); const s = FS.addMonths(`${y}-${FS.pad(fy)}-01`, (q - 1) * 3); return [s, FS.addDays(FS.addMonths(s, 3), -1)]; }
    if (p.type === 'year') { const s = `${p.value}-${FS.pad(fy)}-01`; return [s, FS.addDays(FS.addMonths(s, 12), -1)]; }
    if (p.type === 'range') return [p.from, p.to];
    return ['0000-01-01', '9999-12-31'];
  },
  auditDate(w) { return (w.startedAt || w.plannedDate || '').slice(0, 10); },
  completedWOs(filter) { return this.applyFilter(this.wos(), filter, 'wo').filter((w) => this.isDone(w) && w.score && w.score.overall && w.score.overall.pct !== null); },
  applyFilter(list, f, kind) {
    if (!f) return list;
    const [a, b] = this.periodRange(f.period);
    return list.filter((r) => {
      if (f.apu && r.apu !== f.apu) return false;
      if (f.dept && r.dept !== f.dept) return false;
      if (f.zone && r.zone !== f.zone) return false;
      if (f.auditor && kind === 'wo' && r.auditor !== f.auditor) return false;
      if (f.auditType && kind === 'wo' && r.auditType !== f.auditType) return false;
      if (f.section && kind !== 'none') { const z = this.zone(r.zone); if (!z || z.section !== f.section) return false; }
      const d = kind === 'wo' ? (this.isDone(r) ? this.auditDate(r) : r.plannedDate) : kind === 'finding' ? r.auditDate || (r.createdAt || '').slice(0, 10) : (r.createdAt || '').slice(0, 10);

  },
  latestAudit(zoneId, before) { const l = Store.all('workorders').filter((w) => w.zone === zoneId && this.isDone(w) && w.score && (!before || this.auditDate(w) < before)).sort((a, b) => this.auditDate(b).localeCompare(this.auditDate(a))); return l[0] || null; },
  prevAudit(wo) { return Store.all('workorders').filter((w) => w.zone === wo.zone && w.id !== wo.id && this.isDone(w) && w.score && this.auditDate(w) < this.auditDate(wo)).sort((a, b) => this.auditDate(b).localeCompare(this.auditDate(a)))[0] || null; },
  nextAudit(zoneId) { const t = this.today; const w = Store.all('workorders').filter((x) => x.zone === zoneId && FS.WO_OPEN.includes(x.status)).sort((a, b) => a.plannedDate.localeCompare(b.plannedDate))[0]; if (w) return w.plannedDate; let best = null; Store.all('schedules').filter((s) => s.zone === zoneId && s.status === 'Active').forEach((s) => { const o = FS.occurrences(s, t, FS.addDays(t, 120))[0]; if (o && (!best || o < best)) best = o; }); return best; },
  zoneOpenActions(zoneId) { return Store.all('actions').filter((a) => a.zone === zoneId && this.isActOpen(a)); },

  /* repeat findings: same zone + question across distinct audits */
  repeatGroups(list) {
    const fs = list || this.findings();
    const g = groupBy(fs, (f) => f.zone + '|' + f.qid);
    const out = [];
    Object.values(g).forEach((arr) => {
      const audits = uniq(arr.map((f) => f.woId)); if (audits.length < 2) return;
      const sorted = arr.slice().sort((a, b) => (a.auditDate || '').localeCompare(b.auditDate || ''));
      const zoneAudits = Store.all('workorders').filter((w) => w.zone === sorted[0].zone && this.isDone(w)).sort((a, b) => this.auditDate(a).localeCompare(this.auditDate(b))).map((w) => w.id);
      const hit = new Set(audits); let run = 0, best = 0; zoneAudits.forEach((id) => { if (hit.has(id)) { run++; best = Math.max(best, run); } else run = 0; });
      const lastF = sorted[sorted.length - 1]; const prevF = sorted[sorted.length - 2];
      const prevActs = Store.all('actions').filter((a) => a.findingId === prevF.id);
      const effective = prevActs.length && prevActs.every((a) => FS.ACT_CLOSED.includes(a.status)) ? 'Not effective – recurred after closure' : prevActs.length ? 'Previous action still open' : 'No action on previous occurrence';
      out.push({ key: sorted[0].zone + '|' + sorted[0].qid, zone: sorted[0].zone, s: sorted[0].s, qid: sorted[0].qid, question: sorted[0].question, desc: lastF.desc, count: audits.length, consecutive: best, first: sorted[0].auditDate, last: lastF.auditDate, findings: sorted, prevAction: prevActs.map((a) => a.desc).join('; '), responsible: lastF.responsible, effectiveness: effective, severity: lastF.severity });
    });
    return out.sort((a, b) => b.consecutive - a.consecutive || b.count - a.count);
  },
  recurringThemes(list) {
    const fs = list || this.findings(); const groups = [];
    fs.forEach((f) => { let g = groups.find((x) => x.s === f.s && FS.similarity(x.label, f.desc) >= 0.34); if (!g) { g = { label: f.desc, s: f.s, n: 0, zones: new Set(), items: [] }; groups.push(g); } g.n++; g.zones.add(f.zone); g.items.push(f); });
    return groups.filter((g) => g.n > 1).sort((a, b) => b.n - a.n).map((g) => Object.assign(g, { zones: [...g.zones] }));
  },

  /* KPIs */
  kpis(f) {
    const wosP = this.applyFilter(this.wos().filter((w) => w.status !== 'Cancelled'), f, 'wo');
    const planned = wosP.length; const done = wosP.filter((w) => this.isDone(w));
    const scores = done.map((w) => w.score && w.score.overall.pct).filter((v) => v !== null && v !== undefined);
    const fs = this.applyFilter(this.findings(), f, 'finding');
    const fsOpen = fs.filter((x) => this.findSt(x) !== 'Closed');
    const acts = this.applyFilter(this.actions(), Object.assign({}, f, { period: { type: 'all' } }), 'action');
    const actsP = this.applyFilter(this.actions(), f, 'action');
    const open = acts.filter((a) => this.isActOpen(a)); const overdue = open.filter((a) => this.actStatus(a) === 'Overdue');
    const zones = this.scopeZones().filter((z) => z.status === 'Active' && (!f.apu || z.apu === f.apu) && (!f.dept || z.dept === f.dept) && (!f.zone || z.id === f.zone));
    const zScores = zones.map((z) => { const w = done.filter((x) => x.zone === z.id).sort((a, b) => this.auditDate(b).localeCompare(this.auditDate(a)))[0]; return { z, pct: w ? w.score.overall.pct : null, w }; }).filter((x) => x.pct !== null).sort((a, b) => b.pct - a.pct);
    const reps = this.repeatGroups(fs);
    return {
      zones: zones.length, planned, completed: done.length, completion: planned ? (done.length / planned) * 100 : null,
      avgScore: round1(avg(scores)), findings: fs.length, findingsOpen: fsOpen.length, findingsClosed: fs.length - fsOpen.length,
      critical: fs.filter((x) => x.severity === 'Critical').length, criticalOpen: fsOpen.filter((x) => x.severity === 'Critical').length,
      openActions: open.length, overdue: overdue.length, overduePct: open.length ? (overdue.length / open.length) * 100 : null,
      actionClosure: actsP.length ? (actsP.filter((a) => !this.isActOpen(a)).length / actsP.length) * 100 : null,
      findingRate: done.length ? fs.length / done.length : null, repeatRate: fs.length ? (sum(reps.map((r) => r.findings.filter((x) => fs.includes(x)).length - 1)) / fs.length) * 100 : null,
      best: zScores[0] || null, worst: zScores[zScores.length - 1] || null, zScores, done, fs, acts, open, overdueList: overdue,
    };
  },
  sAverages(done) { const o = {}; FS.S_KEYS.forEach((s) => (o[s] = round1(avg(done.map((w) => w.score[s] && w.score[s].pct))))); return o; },
  monthlyTrend(f, months) {
    return months.map((m) => { const ff = Object.assign({}, f, { period: { type: 'month', value: m } }); const d = this.completedWOs(ff); const o = { m, overall: round1(avg(d.map((w) => w.score.overall.pct))), n: d.length }; FS.S_KEYS.forEach((s) => (o[s] = round1(avg(d.map((w) => w.score[s].pct))))); return o; });
  },
  fyMonths(endMonth) { const st = this.settings(); const fy = st.fiscalYearStart || 4; const y = FS.fiscalYear(endMonth + '-01', fy); const out = []; let d = `${y}-${FS.pad(fy)}-01`; for (let i = 0; i < 12; i++) { out.push(d.slice(0, 7)); d = FS.addMonths(d, 1); } return out; },
  lastDataMonth() { const d = Store.all('workorders').filter((w) => this.isDone(w)).map((w) => this.auditDate(w).slice(0, 7)).sort(); const t = this.today.slice(0, 7); const prior = d.filter((m) => m <= t); return prior[prior.length - 1] || t; },

  /* smart alerts */
  alerts(f) {
    const st = this.settings(); const t = this.today; const out = [];
    const wos = this.wos().filter((w) => !f || !f.apu || w.apu === f.apu);
    wos.filter((w) => this.woStatus(w) === 'Overdue').forEach((w) => out.push({ lvl: 'crit', icon: 'clock', text: `Audit ${w.no} for zone ${w.zone} is overdue (due ${fmtDate(w.dueDate)}).`, go: ['wo', w.id] }));
    wos.filter((w) => FS.WO_OPEN.includes(w.status) && w.plannedDate > t && FS.diffDays(w.plannedDate, t) <= (st.auditDueSoonDays || 2)).forEach((w) => out.push({ lvl: 'info', icon: 'calendar', text: `Audit for ${w.zone} is due ${relDays(w.plannedDate)} – auditor ${this.uname(w.auditor)}.`, go: ['wo', w.id] }));
    const acts = this.actions().filter((a) => this.isActOpen(a) && (!f || !f.apu || a.apu === f.apu));
    const od = acts.filter((a) => this.actStatus(a) === 'Overdue');
    const odCrit = od.filter((a) => { const fi = Store.get('findings', a.findingId); return fi && ['Critical', 'Major'].includes(fi.severity); });
    Object.entries(groupBy(odCrit, (a) => a.dept)).forEach(([d, l]) => out.push({ lvl: 'crit', icon: 'alert', text: `${l.length} critical/major action${l.length > 1 ? 's are' : ' is'} overdue in ${d}.`, go: ['car', { tab: 'actions', status: 'Overdue', dept: d }] }));
    if (od.length - odCrit.length > 0) out.push({ lvl: 'warn', icon: 'clock', text: `${od.length - odCrit.length} other actions are past their target date.`, go: ['car', { tab: 'actions', status: 'Overdue' }] });
    const soon = acts.filter((a) => ['Open', 'In Progress'].includes(a.status) && (a.revisedTarget || a.target) >= t && FS.diffDays(a.revisedTarget || a.target, t) <= (st.actionDueSoonDays || 3));
    if (soon.length) out.push({ lvl: 'info', icon: 'clock', text: `${soon.length} action${soon.length > 1 ? 's are' : ' is'} due within ${st.actionDueSoonDays || 3} days.`, go: ['car', { tab: 'actions', status: 'due-soon' }] });
    this.scopeZones().filter((z) => !f || !f.apu || z.apu === f.apu).forEach((z) => {
      const l = Store.all('workorders').filter((w) => w.zone === z.id && this.isDone(w) && w.score && w.auditType === 'Monthly Audit').sort((a, b) => this.auditDate(a).localeCompare(this.auditDate(b)));
      if (l.length >= 2) { const a = l[l.length - 2].score.overall.pct, b = l[l.length - 1].score.overall.pct; if (a - b >= (st.scoreDropAlert || 10)) out.push({ lvl: 'crit', icon: 'chart', text: `Zone ${z.code} 5S score dropped from ${Math.round(a)}% to ${Math.round(b)}%.`, go: ['zone', z.id] }); else if (b < (st.alertScoreThreshold || 70)) out.push({ lvl: 'warn', icon: 'chart', text: `Zone ${z.code} is below the ${st.alertScoreThreshold || 70}% threshold at ${Math.round(b)}%.`, go: ['zone', z.id] }); }
      if (l.length >= 4) { const s5 = l.slice(-4).map((w) => w.score.S5.pct); if (s5[0] > s5[1] && s5[1] > s5[2] && s5[2] > s5[3]) out.push({ lvl: 'warn', icon: 'repeat', text: `S5 Sustain in ${z.code} has declined for 3 audits in a row (${s5.map(Math.round).join(' → ')}%).`, go: ['zone', z.id] }); }
    });
    this.findings().filter((x) => x.severity === 'Critical' && this.findSt(x) !== 'Closed' && (!f || !f.apu || x.apu === f.apu)).forEach((x) => out.push({ lvl: 'crit', icon: 'flag', text: `Open critical finding in ${x.zone}: ${x.desc}`, go: ['finding', x.id] }));
    this.repeatGroups().filter((r) => r.consecutive >= 3 && (!f || !f.apu || (this.zone(r.zone) || {}).apu === f.apu)).forEach((r) => out.push({ lvl: 'warn', icon: 'repeat', text: `Repeat finding in ${r.zone} (${r.s} – ${this.sName(r.s)}): "${r.desc}" in ${r.consecutive} consecutive audits.`, go: ['car', { tab: 'repeat' }] }));
    const m = this.lastDataMonth(); const k = this.kpis(Object.assign({}, f || {}, { period: { type: 'month', value: m } }));
    if (k.completion !== null && k.completion < (st.completionTarget || 95)) out.push({ lvl: 'warn', icon: 'clipboard', text: `Audit completion for ${fmtMonth(m)} is ${Math.round(k.completion)}% against a ${st.completionTarget || 95}% target.`, go: ['wos', { tab: 'overdue' }] });
    const order = { crit: 0, warn: 1, info: 2 };
    return out.sort((a, b) => order[a.lvl] - order[b.lvl]);
  },

  /* audit trail + notifications */
  _logDoc: null,

const Search = {
  run(q) {

    const m = (s) => String(s || '').toLowerCase().includes(q); const res = [];
    Domain.wos().filter((w) => m(w.no) || m(w.zone) || m(w.plannedDate) || m(fmtDate(w.plannedDate).replace(/\u2011/g, '-'))).slice(0, 6).forEach((w) => res.push(['Audit work orders', 'wo', w.id, w.no, `${w.zone} · ${fmtDate(w.plannedDate)} · ${Domain.woStatus(w)}`]));
    Domain.scopeZones().filter((z) => m(z.code) || m(z.name) || m(z.dept)).slice(0, 5).forEach((z) => res.push(['Zones', 'zone', z.id, z.code, z.name + ' · ' + z.dept]));
    Domain.findings().filter((f) => m(f.no) || m(f.desc)).slice(0, 6).forEach((f) => res.push(['Findings', 'finding', f.id, f.no, f.zone + ' · ' + f.desc]));
    Domain.actions().filter((a) => m(a.no) || m(a.desc)).slice(0, 6).forEach((a) => res.push(['Actions', 'action', a.id, a.no, a.zone + ' · ' + a.desc]));
    if (Domain.can('User Role') || Domain.can('5S Organization')) Store.all('users').filter((u) => m(u.name) || m(u.id) || m(u.dept)).slice(0, 5).forEach((u) => res.push(['Employees', Domain.can('User Role') ? 'users' : 'org', Domain.can('User Role') ? JSON.stringify({ q: u.id }) : '', u.name, `${u.id} · ${u.dept} · ${ROLE_LABEL[u.role]}`]));
    if (!res.length) { box.innerHTML = `<div class="search-res"><div class="sr-h">No matches for “${esc(q)}”</div></div>`; return; }
    let last = ''; box.innerHTML = `<div class="search-res">${res.map(([g, p, id, t, s]) => { const h = g !== last ? `<div class="sr-h">${g}</div>` : ''; last = g; return `${h}<a data-go="${p}" data-id="${esc(id)}"><b class="mono">${esc(t)}</b><span class="small muted">${esc(s)}</span></a>`; }).join('')}</div>`;
  },
};

    const comp = months.map((m) => { const ff = Object.assign({}, f, { period: { type: 'month', value: m } }); const kk = Domain.applyFilter(Domain.wos().filter((w) => w.status !== 'Cancelled'), ff, 'wo'); return { m, p: kk.length, c: kk.filter((w) => Domain.isDone(w)).length }; }).filter((x) => x.p || x.m <= Domain.today.slice(0, 7));
    const depts = Object.entries(groupBy(k.done, (w) => w.dept)).map(([d, l]) => ({ label: d, sub: `${uniq(l.map((w) => w.zone)).length} zones · ${l.length} audits`, value: round1(avg(l.map((w) => w.score.overall.pct))), act: 'dash-dept', v: d })).map((x) => Object.assign(x, { color: Domain.bandColor(x.value) })).sort((a, b) => b.value - a.value);
    const themes = Domain.recurringThemes(Domain.applyFilter(Domain.findings(), Object.assign({}, f, { period: { type: 'all' } }), 'finding')).slice(0, 5);
    const improv = k.zScores.map((x) => { const p = Domain.prevAudit(x.w); return { z: x.z, cur: x.pct, prev: p ? p.score.overall.pct : null }; }).filter((x) => x.prev !== null).map((x) => Object.assign(x, { d: round1(x.cur - x.prev) })).sort((a, b) => b.d - a.d);
    const alerts = Domain.alerts(f);
    const delta = (cur, prev) => (cur === null || prev === null ? '' : `<span class="delta ${cur >= prev ? 'up' : 'down'}">${cur >= prev ? '▲' : '▼'} ${Math.abs(round1(cur - prev))}</span>`);
    const prevMonth = s.ptype === 'month' ? FS.addMonths(s.pval + '-01', -1).slice(0, 7) : null;
    const kPrev = prevMonth ? Domain.kpis(Object.assign({}, f, { period: { type: 'month', value: prevMonth } })) : null;

    return `${UI.head('5S Management Dashboard', [], `<button class="btn" data-go="reports" data-id='${JSON.stringify({ r: 'mgmt' })}'>${icon('file')}Management report</button>`, `${esc(per)} · ${App.plant === 'all' ? 'All plants' : esc(Domain.plantName(App.plant))}${s.apu ? ' · ' + esc(Domain.apuName(s.apu)) + ' APU' : ''}${s.dept ? ' · ' + esc(s.dept) : ''}`)}
      ${Filt.bar('dash', s)}
      <div class="kpis" style="margin-bottom:12px">
        <button class="kpi" data-go="wos" data-id='${JSON.stringify({ tab: 'all' })}'><span class="k-l">No. of Audits · Plan vs Actual</span><span class="k-v">${k.completed}<small> / ${k.planned}</small></span>${UI.meter(k.completion, k.completion >= (st.completionTarget || 95) ? 'var(--good)' : 'var(--warn)')}<span class="k-s">${fmtPct(k.completion)} completed · target ${st.completionTarget || 95}%</span></button>

        <button class="kpi" data-go="car" data-id='${JSON.stringify({ tab: 'findings', fstatus: 'open' })}'><span class="k-l">Open</span><span class="k-v" style="color:${k.findingsOpen ? 'var(--warn)' : 'inherit'}">${k.findingsOpen}</span><span class="k-s">findings · ${k.openActions} open actions${k.overdue ? ` · <b style="color:var(--bad)">${k.overdue} overdue</b>` : ''}</span></button>
        <button class="kpi" data-go="car" data-id='${JSON.stringify({ tab: 'findings', fstatus: 'Closed' })}'><span class="k-l">Closed</span><span class="k-v" style="color:var(--good)">${k.findingsClosed}</span><span class="k-s">findings · action closure ${fmtPct(k.actionClosure)}</span></button>
      </div>
      <div class="kpis six" style="margin-bottom:16px">
        <div class="kpi mini"><span class="k-l">Active zones</span><span class="k-v">${k.zones}</span><span class="k-s">${uniq(k.done.map((w) => w.zone)).length} audited in period</span></div>
        <div class="kpi mini"><span class="k-l">Average 5S score</span><span class="k-v" style="color:${Domain.bandColor(k.avgScore)}">${fmtPct(k.avgScore, 1)}</span><span class="k-s">${esc((Domain.band(k.avgScore) || {}).label || '')} ${kPrev ? delta(k.avgScore, kPrev.avgScore) : ''}</span></div>
        <button class="kpi mini" data-go="car" data-id='${JSON.stringify({ tab: 'actions', status: 'Overdue' })}'><span class="k-l">Overdue actions</span><span class="k-v" style="color:${k.overdue ? 'var(--bad)' : 'inherit'}">${k.overdue}</span><span class="k-s">${fmtPct(k.overduePct)} of open actions</span></button>
        <button class="kpi mini" data-go="car" data-id='${JSON.stringify({ tab: 'findings', sev: 'Critical' })}'><span class="k-l">Critical findings</span><span class="k-v" style="color:${k.criticalOpen ? 'var(--bad)' : 'inherit'}">${k.critical}</span><span class="k-s">${k.criticalOpen} still open</span></button>
        ${k.best ? `<button class="kpi mini" data-go="zone" data-id="${k.best.z.id}"><span class="k-l">Best performing zone</span><span class="k-v">${UI.score(k.best.pct)}</span><span class="k-s">${esc(k.best.z.code)} · ${esc(k.best.z.name)}</span></button>` : '<div class="kpi mini"><span class="k-l">Best performing zone</span><span class="k-v">—</span></div>'}
        ${k.worst ? `<button class="kpi mini" data-go="zone" data-id="${k.worst.z.id}"><span class="k-l">Lowest performing zone</span><span class="k-v">${UI.score(k.worst.pct)}</span><span class="k-s">${esc(k.worst.z.code)} · ${esc(k.worst.z.name)}</span></button>` : '<div class="kpi mini"><span class="k-l">Lowest performing zone</span><span class="k-v">—</span></div>'}
      </div>
      <div class="grid">
        <div class="c6">${UI.card('APU Ranking', UI.hbars(apuRank, { rank: true, fmt: (v) => v + '%', max: 100, target: st.targetScore }), { sub: 'Average audit score in ' + esc(per) + ' · click an APU to focus the dashboard' })}</div>
        <div class="c6">${UI.card('Needs attention', alerts.length ? `<div class="alerts">${alerts.slice(0, 7).map((a) => `<div class="alert ${a.lvl}" data-go="${a.go[0]}" data-id="${esc(typeof a.go[1] === 'object' ? JSON.stringify(a.go[1]) : a.go[1])}"><span class="ai">${icon(a.icon)}</span><span>${esc(a.text)}</span></div>`).join('')}</div>${alerts.length > 7 ? `<button class="btn sm ghost" style="margin-top:8px" data-act="all-alerts">Show all ${alerts.length} alerts</button>` : ''}` : UI.empty('check', 'Nothing needs attention'), { sub: 'Smart alerts from audits, actions and score trends' })}</div>
        <div class="c12">${UI.card('Zone Leader performance', ldr.length ? UI.chart('bars', { labels: ldr.map((x) => x.name), series: [{ name: 'Average zone score', values: ldr.map((x) => x.pct), color: (v) => Domain.bandColor(v) }] }, { h: 260, yMax: 100, unit: '%', target: st.targetScore, rot: true, act: 'dash-leader' }) : UI.empty('chart', 'No completed audits in this period'), { sub: `Latest audit score of each leader's zones · dashed line = ${st.targetScore}% target`, right: `<div class="legend">${(st.bands || []).map((b) => `<span><i style="background:${b.color}"></i>${esc(b.label)}</span>`).join('')}</div>` })}</div>
        <div class="c12">${UI.card('Findings vs No. of Occurrences – Zone wise', fz.length ? `${UI.chart('bars', { labels: fz.map((x) => x.z), series: [{ name: 'Unique findings (distinct checkpoints)', values: fz.map((x) => x.unique), color: 'var(--accent)' }, { name: 'Total occurrences', values: fz.map((x) => x.occ), color: 'var(--s1)' }] }, { h: 250, rot: true, act: 'dash-zone' })}<div class="legend"><span><i style="background:var(--accent)"></i>Unique findings (distinct checkpoints)</span><span><i style="background:var(--s1)"></i>Total occurrences</span><span class="faint">A wide gap means the same checkpoint keeps failing.</span></div>` : UI.empty('chart', 'No findings in this period'), { sub: 'Financial year to date, top 16 zones by occurrences' })}</div>
        <div class="c8">${UI.card('5S Score Trend', UI.chart('line', { labels: months.map((m) => MON[Number(m.slice(5)) - 1]), series: [{ name: 'Overall', values: trend.map((t) => t.overall), color: 'var(--accent)', area: true, width: 2.8 }] }, { h: 240, target: st.targetScore, yMin: 50 }), { sub: 'Monthly average overall score, ' + esc(Filt.periodOpts('year').find((x) => x[0] === String(FS.fiscalYear(months[0] + '-01', st.fiscalYearStart)))?.[1] || '') })}</div>
        <div class="c4">${UI.card('S1–S5 Performance', `${UI.chart('bars', { labels: FS.S_KEYS.slice(), series: [{ name: 'Score', values: FS.S_KEYS.map((x) => sAvg[x]), color: (v, i) => `var(--s${i + 1})` }] }, { h: 220, yMax: 100, unit: '%', target: st.targetScore })}${weakest ? `<div class="small" style="margin-top:6px">Weakest S: <b>${weakest} – ${esc(Domain.sName(weakest))}</b> at ${fmtPct(sAvg[weakest])}</div>` : ''}`, { sub: 'Average of audits in period' })}</div>
        <div class="c4">${UI.card('Finding severity', UI.chart('donut', { items: sevs, centerLabel: 'findings' }, { h: 190 }), { sub: esc(per) })}</div>
        <div class="c4">${UI.card('Action status', `${UI.stackbar(aStat)}<div class="divider" style="margin:14px 0 10px"></div>${Pages.analytics.agingMini(k.open)}`, { sub: 'All actions in scope' })}</div>
        <div class="c4">${UI.card('Audit completion', UI.chart('bars', { labels: comp.map((x) => MON[Number(x.m.slice(5)) - 1]), series: [{ name: 'Planned', values: comp.map((x) => x.p), color: 'var(--surface-3)' }, { name: 'Completed', values: comp.map((x) => x.c), color: 'var(--good)' }] }, { h: 190, values: false }) + '<div class="legend"><span><i style="background:var(--surface-3)"></i>Planned</span><span><i style="background:var(--good)"></i>Completed</span></div>', { sub: 'Planned vs completed per month' })}</div>
        <div class="c6">${UI.card('Zone ranking', `<div class="grid" style="gap:14px"><div class="c6"><div class="eyebrow" style="margin-bottom:8px">Top 5</div>${UI.hbars(k.zScores.slice(0, 5).map((x) => ({ label: x.z.code, sub: x.z.name, value: round1(x.pct), color: Domain.bandColor(x.pct), go: ['zone', x.z.id] })), { max: 100, fmt: (v) => Math.round(v) + '%' })}</div><div class="c6"><div class="eyebrow" style="margin-bottom:8px">Bottom 5</div>${UI.hbars(k.zScores.slice(-5).reverse().map((x) => ({ label: x.z.code, sub: x.z.name, value: round1(x.pct), color: Domain.bandColor(x.pct), go: ['zone', x.z.id] })), { max: 100, fmt: (v) => Math.round(v) + '%' })}</div></div><button class="btn sm ghost" data-go="analytics" data-id='${JSON.stringify({ tab: 'heat' })}' style="margin-top:8px">Open 5S heat map</button>`, { sub: 'Latest audit in period' })}</div>
        <div class="c6">${UI.card('Department performance', UI.hbars(depts, { fmt: (v) => v + '%', max: 100, target: st.targetScore }), { sub: 'Click a department to drill down' })}</div>
        <div class="c6">${UI.card('Top recurring findings', themes.length ? `<div class="stack tight">${themes.map((t, i) => `<div class="row top" style="gap:10px;padding:6px 0;border-bottom:1px solid var(--line-2)"><span class="rank">${i + 1}</span>${UI.stag(t.s)}<div class="grow"><div>${esc(t.label)}</div><div class="small faint">${t.zones.slice(0, 6).join(', ')}${t.zones.length > 6 ? ' +' + (t.zones.length - 6) : ''}</div></div><b class="num" style="font-size:18px">${t.n}</b></div>`).join('')}</div>` : UI.empty('repeat', 'No recurring findings'), { sub: 'Grouped by similar description within the same S', right: `<button class="btn sm ghost" data-go="car" data-id='${JSON.stringify({ tab: 'repeat' })}'>Repeat analysis</button>` })}</div>
        <div class="c6">${UI.card('Improvement vs previous audit', improv.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Zone</th><th class="num">Previous</th><th class="num">Latest</th><th class="num">Change</th></tr></thead><tbody>${improv.slice(0, 4).concat(improv.length > 8 ? [null] : [], improv.slice(-4).filter((x) => !improv.slice(0, 4).includes(x))).map((x) => (x ? `<tr class="click" data-go="zone" data-id="${x.z.id}"><td><b class="mono">${esc(x.z.code)}</b> <span class="muted small">${esc(x.z.name)}</span></td><td class="num">${fmtPct(x.prev)}</td><td class="num">${UI.score(x.cur)}</td><td class="num"><span class="delta ${x.d >= 0 ? 'up' : 'down'}">${x.d >= 0 ? '+' : ''}${x.d} pts (${x.prev ? (x.d >= 0 ? '+' : '') + Math.round((x.d / x.prev) * 100) + '%' : ''})</span></td></tr>` : '<tr><td colspan="4" class="center faint small">…</td></tr>')).join('')}</tbody></table></div>` : UI.empty('chart', 'Not enough audit history'), { sub: 'Biggest gains and drops' })}</div>
      </div>`;
  },
};
Object.assign(Acts, {
  'dash-apu'(el) { const s = App.st('dash', Filt.defaults()); s.apu = s.apu === el.dataset.v ? '' : el.dataset.v; s.zone = ''; App.render(); UI.toast(s.apu ? `Dashboard focused on ${Domain.apuName(s.apu)} APU` : 'Showing all APUs'); },
  'dash-dept'(el) { const s = App.st('dash', Filt.defaults()); s.dept = s.dept === el.dataset.v ? '' : el.dataset.v; App.render(); },
  'dash-zone'(el) { const s = App.st('dash', Filt.defaults()); const lbl = UI._charts[el.closest('.chart').dataset.chart].data.labels[Number(el.dataset.i)]; App.go('zone', { id: lbl }); },
  'dash-leader'(el) { const c = UI._charts[el.closest('.chart').dataset.chart]; const name = c.data.labels[Number(el.dataset.i)]; const u = Store.all('users').find((x) => x.name === name); const z = u && Store.all('zones').find((x) => x.leader === u.id); if (z) App.go('zone', { id: z.id }); },
  'all-alerts'() { const s = App.st('dash', Filt.defaults()); const al = Domain.alerts(Filt.toFilter(s)); UI.modal({ title: 'All alerts', size: 'wide', body: `<div class="alerts">${al.map((a) => `<div class="alert ${a.lvl}" data-go="${a.go[0]}" data-id="${esc(typeof a.go[1] === 'object' ? JSON.stringify(a.go[1]) : a.go[1])}"><span class="ai">${icon(a.icon)}</span><span>${esc(a.text)}</span></div>`).join('')}</div>` }); },
});

/* ---------- Analytics ---------- */
Pages.analytics = {
  perm: 'Analytics',
  agingMini(open) {
    const buckets = Pages.analytics.buckets(open);
    return `<div class="eyebrow" style="margin-bottom:6px">Open action aging</div><div class="row" style="gap:6px">${buckets.map((b) => `<div style="flex:1;min-width:52px;text-align:center;padding:6px 2px;border-radius:6px;background:${b.over ? 'var(--bad-soft)' : 'var(--surface-2)'}"><div class="num" style="font-size:18px;font-weight:600">${b.list.length}</div><div class="tiny faint">${b.label}</div></div>`).join('')}</div>`;
  },
  buckets(open) {
    const t = Domain.today; const B = [['0–7 d', 0, 7], ['8–15 d', 8, 15], ['16–30 d', 16, 30], ['31–60 d', 31, 60], ['>60 d', 61, 1e9]];
    return B.map(([label, a, b]) => { const list = open.filter((x) => { const age = FS.diffDays(t, (x.createdAt || t).slice(0, 10)); return age >= a && age <= b; }); return { label, list, over: list.some((x) => Domain.actStatus(x) === 'Overdue') }; });
  },
  render() {
    const tab = App.ui.anTab || 'heat';
    const s = App.st('an', Object.assign(Filt.defaults(), { ptype: 'year', pval: String(FS.fiscalYear(Domain.today, Domain.settings().fiscalYearStart || 4)) }));
    const body = { heat: this.heat, trend: this.trend, aging: this.aging, auditors: this.auditors, depts: this.depts, duration: this.duration }[tab].call(this, s);
    return `${UI.head('Analytics', [], '', 'Heat map, trends, aging and people analytics')}
      ${UI.tabs('anTab', [['heat', '5S Heat Map'], ['trend', 'Trend Analysis'], ['aging', 'Action Aging'], ['depts', 'Departments'], ['auditors', 'Auditors'], ['duration', 'Audit Duration']], tab)}
      ${Filt.bar('an', s, { section: true })}${body}`;
  },
  heat(s) {
    const f = Filt.toFilter(s); const done = Domain.completedWOs(f); const st = Domain.settings();
    const zones = Domain.scopeZones().filter((z) => (!s.apu || z.apu === s.apu) && (!s.dept || z.dept === s.dept) && (!s.zone || z.id === s.zone) && (!s.section || z.section === s.section));
    const rows = zones.map((z) => { const l = done.filter((w) => w.zone === z.id).sort((a, b) => Domain.auditDate(b).localeCompare(Domain.auditDate(a))); const w = l[0]; return { z, w }; }).sort((a, b) => (b.w ? b.w.score.overall.pct : -1) - (a.w ? a.w.score.overall.pct : -1));
    const cell = (p) => (p === null || p === undefined ? '<td class="hc"><span class="faint">—</span></td>' : `<td class="hc"><span style="background:color-mix(in srgb, ${Domain.bandColor(p)} 22%, transparent);color:var(--ink);box-shadow:inset 3px 0 0 ${Domain.bandColor(p)}">${Math.round(p)}</span></td>`);
    return UI.card('Zone-wise 5S heat map', `<div class="tbl-wrap"><table class="tbl heat"><thead><tr><th>Zone</th>${FS.S_KEYS.map((x) => `<th>${x}<div class="tiny faint" style="text-transform:none;letter-spacing:0">${esc(Domain.sName(x))}</div></th>`).join('')}<th>Overall</th><th>Audit</th></tr></thead><tbody>${rows.map(({ z, w }) => `<tr class="click" data-go="zone" data-id="${z.id}"><td><b class="mono">${esc(z.code)}</b><div class="small muted">${esc(z.name)} · ${esc(Domain.apuName(z.apu))}</div></td>${FS.S_KEYS.map((x) => cell(w ? w.score[x].pct : null)).join('')}<td class="hc">${w ? UI.score(w.score.overall.pct) : '<span class="faint">—</span>'}</td><td class="small nowrap">${w ? fmtDate(Domain.auditDate(w)) : '<span class="faint">No audit</span>'}</td></tr>`).join('')}</tbody></table></div><div class="legend" style="margin-top:10px">${(st.bands || []).map((b) => `<span><i style="background:${b.color}"></i>${esc(b.label)} ≥ ${b.min}</span>`).join('')}<span class="faint">Bands are configured in Master → Scoring.</span></div>`, { sub: 'Latest audit per zone in ' + esc(Filt.label(s)) + ' · click a zone for its profile' });
  },
  trend(s) {
    const zs = Domain.scopeZones().filter((z) => (!s.apu || z.apu === s.apu) && (!s.dept || z.dept === s.dept));
    const zid = s.zone || App.ui.trendZone || (zs[0] && zs[0].id);
    const months = Domain.fyMonths(s.ptype === 'month' ? s.pval : Domain.lastDataMonth());
    const f = Filt.toFilter(Object.assign({}, s, { zone: s.zone }));
    const tr = Domain.monthlyTrend(Object.assign({}, f, { period: { type: 'all' } }), months).filter((x) => x.m <= Domain.today.slice(0, 7));
    const hide = App.st('trendHide', {});
    const series = [{ k: 'overall', name: 'Overall', color: 'var(--ink)', width: 3 }].concat(FS.S_KEYS.map((x, i) => ({ k: x, name: x + ' ' + Domain.sName(x), color: `var(--s${i + 1})`, width: 1.8 }))).filter((x) => !hide[x.k]).map((x) => Object.assign(x, { values: tr.map((t) => t[x.k]) }));
    const tbl = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Month</th>${FS.S_KEYS.map((x) => `<th class="num">${x}</th>`).join('')}<th class="num">Overall</th><th class="num">Audits</th></tr></thead><tbody>${tr.map((t) => `<tr><td>${fmtMonth(t.m)}</td>${FS.S_KEYS.map((x) => `<td class="num">${t[x] === null ? '—' : Math.round(t[x])}</td>`).join('')}<td class="num">${t.overall === null ? '—' : UI.score(t.overall)}</td><td class="num">${t.n}</td></tr>`).join('')}</tbody></table></div>`;
    const reps = s.zone ? Domain.repeatGroups().filter((r) => r.zone === s.zone) : [];
    const zf = s.zone ? Domain.findings().filter((x) => x.zone === s.zone) : Domain.applyFilter(Domain.findings(), Object.assign({}, f, { period: { type: 'all' } }), 'finding');
    const fByM = months.map((m) => zf.filter((x) => (x.auditDate || '').startsWith(m)).length);
    const aByM = months.map((m) => { const za = Domain.applyFilter(Domain.actions(), Object.assign({}, f, { period: { type: 'all' } }), 'action'); return za.filter((a) => (a.verifiedAt || '').startsWith(m)).length; });
    return `<div class="grid"><div class="c12">${UI.card(s.zone ? `Score trend – ${esc(s.zone)}` : 'Score trend – all zones in filter', `<div class="legend" style="margin-bottom:8px">${[{ k: 'overall', name: 'Overall', color: 'var(--ink)' }].concat(FS.S_KEYS.map((x, i) => ({ k: x, name: x + ' ' + Domain.sName(x), color: `var(--s${i + 1})` }))).map((x) => `<button class="${hide[x.k] ? 'off' : ''}" data-act="trend-toggle" data-v="${x.k}"><i style="background:${x.color}"></i>${esc(x.name)}</button>`).join('')}</div>${UI.chart('line', { labels: tr.map((t) => MON[Number(t.m.slice(5)) - 1]), series }, { h: 300, target: Domain.settings().targetScore, endLabels: true })}`, { sub: 'Pick one zone in the filter above for the zone trend; click a legend item to hide a line' })}</div>
      <div class="c7">${UI.card('Monthly table', tbl)}</div>

};
